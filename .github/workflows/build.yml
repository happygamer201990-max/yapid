name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create flet.toml if missing
        run: |
          if [ ! -f flet.toml ]; then
            echo 'app_name = "MyGame"' > flet.toml
            echo 'main_module = "main"' >> flet.toml
          fi

      - name: Build APK
        env:
          CI: 'true'
          FLET_NON_INTERACTIVE: 'true'
        run: |
          printf 'y\ny\ny\n' | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/apk/*.apk
            build/flutter/build/app/outputs/flutter-apk/*.apk
